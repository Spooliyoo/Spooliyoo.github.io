name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build for hosting at a domain root
        run: npm run build
        env:
          NEXT_PUBLIC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      - run: cd out && zip -r ../filament-tracker-${{ github.ref_name }}.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: filament-tracker-${{ github.ref_name }}.zip
          generate_release_notes: true