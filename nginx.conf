server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml application/manifest+json application/octet-stream;
    gzip_min_length 1024;

    # Service worker must never be cached, or the "Update available" prompt stops working.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location ~ \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Versioned build files (including PGlite's WASM) never change once published.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;
}
